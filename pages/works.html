<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" href="../src/assets/favicon.ico" type="image/x-icon">
    <!-- Basic SEO -->
    <meta name="description"
        content="There Might Be No Works, is a work related to There Will Be Works. It's a web-based conceptual artwork that guides participants to drive through the city and produce street photography or photo-documentary style snapshots using machine learning.">
    <meta name="keywords" content="art, urban society, street photography, contemporary art, modern art">
    <meta name="author" content="HsienYU CHENG">
    <meta name="robots" content="index, follow">
    <title>There Might be No Works</title>
    <style>
        body { margin: 0; padding: 16px 12px 90px; font-family: system-ui, sans-serif; }
        .language-control { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
        .language-control select { min-height: 44px; font: inherit; }
        [hidden] { display: none !important; }
        #works-title {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: transparent;
            text-decoration: line-through;
            font-size: clamp(2rem, 9vw, 10em);
            pointer-events: none;
            z-index: -1;
            -webkit-text-stroke: 0.5px black;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            border: 1px solid #c7c7c7;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            background-color: #fff;
        }

        .card img {
            width: 100%;
            height: auto;
        }

        .card-body {
            padding: 20px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: bold;
        }

        .card-year {
            font-size: 1rem;
            font-weight: bold;
        }

        .card-coordinate-link {
            color: inherit;
            text-decoration: underline;
        }

        .card-material {
            font-size: 1rem;
            font-weight: bold;
        }

        .card-description {
            white-space: pre-wrap;
            /* Preserve newlines */
        }

        .back-button {
            position: fixed;
            bottom: 20px;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            z-index: 99999;
        }

        .back-button:hover {
            background-color: #202020;
        }
    </style>
</head>

<body>
    <nav class="language-control">
        <label for="language-select" data-i18n="language">Language</label>
        <select id="language-select">
            <option value="auto" data-i18n="automatic">Automatic</option>
            <option value="en" lang="en">English</option>
            <option value="zh-TW" lang="zh-TW">繁體中文</option>
        </select>
    </nav>
    <p id="gallery-status" role="status" data-i18n="galleryLoading">Loading works…</p>
    <div class="card-container" id="card-container"></div>
    <a href="../" class="back-button" data-i18n="nextLocation">Start to Next Location</a>

    <h1 id="works-title" class="display-1">There Might be No Works</h1>

    <script type="module">
        import { mapLinkForCoordinates } from './works-map-link.js';
        import { createI18n, bindLanguageUI } from '../src/js/i18n.js';

        const i18n = createI18n({ window });
        bindLanguageUI(i18n, document);
        const translations = [];
        i18n.subscribe(() => translations.forEach(render => render()));
        const status = document.getElementById('gallery-status');

        document.addEventListener('DOMContentLoaded', function () {
            fetch('https://data.therewillbeworks.com/items/works', {
                method: 'GET',
                mode: 'cors',
                credentials: 'include',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const container = document.getElementById('card-container');
                    status.dataset.i18n = data.data.length ? '' : 'galleryEmpty';
                    status.textContent = data.data.length ? '' : i18n.t('galleryEmpty');
                    status.hidden = data.data.length > 0;

                    // Sort data in descending order based on date_created
                    data.data.sort((a, b) => new Date(b.date_created) - new Date(a.date_created));

                    data.data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';

                        const img = document.createElement('img');
                        img.src = `https://data.therewillbeworks.com/assets/${item.photo}`;

                        const cardBody = document.createElement('div');
                        cardBody.className = 'card-body';

                        const title = document.createElement('h5');
                        title.className = 'card-title';

                        const year = document.createElement('h5');
                        year.className = 'card-year';
                        const dateLabel = document.createElement('span');
                        year.appendChild(dateLabel);

                        const material = document.createElement('h5');
                        material.className = 'card-material';
                        const translate = () => {
                            img.alt = i18n.t('workImage');
                            title.textContent = i18n.t('photography', { id: item.id });
                            const timestamp = Date.parse(item.date_created);
                            dateLabel.textContent = Number.isFinite(timestamp) ? i18n.date(timestamp) : '';
                            material.textContent = i18n.t('material');
                        };
                        translations.push(translate);
                        translate();

                        const mapLink = mapLinkForCoordinates(item.coordinates);
                        if (mapLink) {
                            const coordinateLink = document.createElement('a');
                            coordinateLink.className = 'card-coordinate-link';
                            coordinateLink.href = mapLink.href;
                            coordinateLink.textContent = mapLink.label;
                            year.append(' ', coordinateLink);
                        }


                        const description = document.createElement('p');
                        description.className = 'card-description';
                        description.textContent = item.description;

                        cardBody.appendChild(title);
                        cardBody.appendChild(year);
                        cardBody.appendChild(material);
                        cardBody.appendChild(description);
                        card.appendChild(img);
                        card.appendChild(cardBody);
                        container.appendChild(card);
                    });
                })
                .catch(() => {
                    console.error('Gallery request failed.');
                    status.dataset.i18n = 'galleryError';
                    status.textContent = i18n.t('galleryError');
                    status.hidden = false;
                });
        });
    </script>
</body>

</html>
